[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-lite"
version = "0.1.0"
description = "Portable file knowledge library with selective legacy wiki import"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
olympus-lite = "olympus_lite.cli:main"

[tool.setuptools]
packages = ["olympus_lite"]
